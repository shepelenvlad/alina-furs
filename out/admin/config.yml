      ]}
                      - {label: "Заголовок", name: title, widget: string}
                      - {label: "Текст", name: text, widget: text}
                      - {label: "Ссылка (необязательно)", name: link, widget: string, required: false}
              - label: "Обо мне (слайдер и текст)"
                name: aboutMe
                widget: object
                fields:
                  - {name: anchor, widget: hidden, default: portfolio}
                  - {label: "Заголовок", name: title, widget: string}
                  - {label: "Подзаголовок", name: subtitle, widget: string, required: false}
                  - {label: "Фотографии для слайдера", name: slides, widget: list, field: {label: "Фото", name: photo, widget: image}}
                  - {label: "Цитата", name: quote, widget: text}
                  - {label: "Фото рядом с цитатой", name: photo, widget: image}
                  - {label: "Имя", name: name, widget: string}
                  - {label: "Должность", name: role, widget: string}
                  - {label: "Текст о себе", name: text, widget: markdown}
              - label: "Галерея отзывов"
                name: gallery
                widget: object
                fields:
                  - {name: anchor, widget: hidden, default: testimonials}
                  - {label: "Заголовок", name: title, widget: string}
                  - {label: "Подзаголовок", name: subtitle, widget: string, required: false}
                  - label: "Отзывы"
                    name: items
                    widget: list
                    summary: "{{fields.name}}"
                    fields:
                      - {label: "Скриншот отзыва", name: image, widget: image}
                      - {label: "Имя", name: name, widget: string, required: false}
                      - {label: "Звёзд (0-5)", name: stars, widget: number, default: 5, min: 0, max: 5, value_type: int}
              - label: "Цены"
                name: pricing
                widget: object
                fields:
                  - {name: anchor, widget: hidden, default: pricing}
                  - {label: "Заголовок", name: title, widget: string}
                  - {label: "Подзаголовок", name: subtitle, widget: string, required: false}
                  - label: "Тарифы"
                    name: plans
                    widget: list
                    summary: "{{fields.name}}"
                    fields:
                      - {label: "Название", name: name, widget: string}
                      - {label: "Валюта", name: currency, widget: string, default: "₽"}
                      - {label: "Цена", name: price, widget: string}
                      - {label: "Старая цена (зачёркнутая, необязательно)", name: oldPrice, widget: string, required: false}
                      - {label: "Единица (например / месяц)", name: unit, widget: string, required: false}
                      - {label: "Плашка (например: Скидка до 27.04)", name: badge, widget: string, required: false}
                      - {label: "Выделить тариф", name: featured, widget: boolean, default: false}
                      - {label: "Что входит", name: features, widget: list, field: {label: "Пункт", name: item, widget: text}}
                      - {label: "Текст кнопки", name: buttonLabel, widget: string, required: false}
                      - {label: "Ссылка кнопки (оплата)", name: buttonLink, widget: string, required: false}
              - label: "Вопросы и ответы"
                name: faq
                widget: object
                fields:
                  - {name: anchor, widget: hidden, default: faq}
                  - {label: "Заголовок", name: title, widget: string}
                  - {label: "Подзаголовок", name: subtitle, widget: string, required: false}
                  - label: "Вопросы"
                    name: items
                    widget: list
                    summary: "{{fields.question}}"
                    fields:
                      - {label: "Вопрос", name: question, widget: string}
                      - {label: "Ответ", name: answer, widget: text}
              - label: "Контакты и форма"
                name: contact
                widget: object
                fields:
                  - {name: anchor, widget: hidden, default: contact}
                  - {label: "Заголовок", name: title, widget: string}
                  - {label: "Подзаголовок", name: subtitle, widget: string, required: false}
                  - label: "Контакты слева"
                    name: contacts
                    widget: list
                    summary: "{{fields.label}}"
                    fields:
                      - {label: "Иконка", name: icon, widget: select, default: "magic", options: [
